name: EDELNERA · Publish versioned release
on:
  push:
    branches: [main]
    paths:
      - VERSION
      - .github/workflows/release.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Publish release if the version is new
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n ' < VERSION)"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid semantic version: $VERSION" >&2
            exit 1
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists"
            exit 0
          fi
          NOTES="docs/release-notes-$VERSION.md"
          if [[ ! -f "$NOTES" ]]; then
            echo "Release notes are required at $NOTES" >&2
            exit 1
          fi
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "EDELNERA $VERSION" --notes-file "$NOTES"
